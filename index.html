<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>時間記録ツール</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#e53935">
  <link rel="apple-touch-icon" href="icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="記録">

  <!-- キャッシュ対策 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial;
      background: linear-gradient(135deg, #f0f4ff, #ffffff);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    body.dark {
      background: #121212;
      color: #f1f1f1;
    }

    .app {
      max-width: 420px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 16px rgba(0,0,0,.1);
    }

    body.dark .card {
      background: #1e1e1e;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 10px;
      border: none;
      font-size: 16px;
    }

    button {
      background: blue;
      color: white;
      font-weight: bold;
    }

    .result {
      margin-top: 16px;
      padding: 16px;
      border-radius: 12px;
      font-weight: bold;
      text-align: center;
    }

    .good { background: #dff5e6; color: #1b7f4d; }
    .warn { background: #fff3cd; color: #856404; }
    .bad  { background: #fde2e2; color: #842029; }

    ul { padding-left: 20px; }
    canvas { max-width: 100%; }
  </style>
</head>

<body>

<button id="toggleDark">🌙 ダークモード</button>

<div class="app">
  <div class="card">
    <h2>時間記録ツール</h2>

    <input type="number" id="numberInput" placeholder="時間を入力">

    <button id="calcBtn">記録</button>
    <button id="resetBtn">今月リセット</button>

    <p id="totalTime">今月の累積：0</p>
    <select id="monthSelect"></select>

    <button id="mailBtn">📩 メールで送信</button>

    <div id="message" class="result"></div>
  </div>

  <h3>日ごとの記録</h3>
  <ul id="list"></ul>

  <canvas id="chart"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>
  function updateStatus() {

  const day = new Date().getDate();
  const result = monthlyTotal / day;

  const msg = document.getElementById("message");
  msg.className = "result";

  if (result >= 2) {
    msg.classList.add("good");
    msg.innerText = "良い状態です";
  }

  else if (result >= 1.6) {
    msg.classList.add("warn");
    msg.innerText = "注意が必要です";
  }

  else {
    msg.classList.add("bad");
    msg.innerText = "危険です";
  }

}
/* ---------- 月キー ---------- */
function monthKey() {
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}`;
}

let allData = JSON.parse(localStorage.getItem("allData")) || {};
if (!allData[monthKey()]) allData[monthKey()] = { total: 0, records: {} };

let monthlyTotal = allData[monthKey()].total;
let records = allData[monthKey()].records;

document.getElementById("totalTime").innerText = `今月の累積：${monthlyTotal}`;

/* ---------- 日付 ---------- */
function todayKey() {
  const d = new Date();
  return `${d.getMonth()+1}/${d.getDate()}`;
}

// ----------月一覧----------
function updateMonthSelect() {
  const select = document.getElementById("monthSelect");
  select.innerHTML = "";

  Object.keys(allData).sort().forEach(key => {
    const option = document.createElement("option");
    option.value = key;
    option.textContent = key;
    if (key === monthKey()) option.selected = true;
    select.appendChild(option);
  });
}




/* ---------- 一覧 ---------- */
function showList() {
  const ul = document.getElementById("list");
  ul.innerHTML = "";
  Object.keys(records).forEach(d => {
    const li = document.createElement("li");
    li.textContent = `${d}：${records[d]}`;
    ul.appendChild(li);
  });
}

/* ---------- グラフ ---------- */
let chart;
function updateChart() {
  if (chart) chart.destroy();
  chart = new Chart(document.getElementById("chart"), {
    type: "bar",
    data: {
      labels: Object.keys(records),
      datasets: [{
        data: Object.values(records),
        backgroundColor: "blue"
      }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true } } }
  });
}

/* ---------- 記録 ---------- */
document.getElementById("calcBtn").onclick = () => {
  const v = Number(numberInput.value);
  if (!v) return;

  monthlyTotal += v;
  records[todayKey()] = (records[todayKey()] || 0) + v;

  allData[monthKey()] = { total: monthlyTotal, records };
  localStorage.setItem("allData", JSON.stringify(allData));

  const day = new Date().getDate();
  const result = monthlyTotal / day;

  const msg = document.getElementById("message");
  msg.className = "result";

  if (result >= 2) {
    msg.classList.add("good");
    msg.textContent = "それよりも，片手は休息で満たす方がよい（伝道の書4:6）";
  } else if (result >= 1.6) {
    msg.classList.add("warn");
    msg.textContent = "時間を有効に使ってください。今は悪い時代だからです。（エフェソス5:16）";
  } else {
    msg.classList.add("bad");
    msg.textContent = "勤勉な人の計画は必ず成功につながり、せっかちな人は必ず貧乏へと向かう（格言2:5）";
  }

  document.getElementById("totalTime").innerText = `今月の累積：${monthlyTotal}`;
  numberInput.value = "";

  showList();
  updateChart();
  updateStatus();
};

/* ---------- リセット ---------- */
resetBtn.onclick = () => {
  allData[monthKey()] = { total: 0, records: {} };
  localStorage.setItem("allData", JSON.stringify(allData));
  location.reload();
};

/* ---------- ダークモード ---------- */
toggleDark.onclick = () => document.body.classList.toggle("dark");

/* ---------- メール ---------- */
mailBtn.onclick = () => {
  const m = new Date().getMonth()+1;
  const body =
`お疲れ様です。
${m}月の野外奉仕報告です
時間：${monthlyTotal}
研究：

よろしくお願いいたします。`;

  location.href = `mailto:?subject=${encodeURIComponent("野外奉仕報告")}&body=${encodeURIComponent(body)}`;
};

showList();
updateChart();
updateMonthSelect();
updateStatus();

// 履歴を表示
document.getElementById("monthSelect").addEventListener("change", e => {
  const selected = e.target.value;

  monthlyTotal = allData[selected].total;
  records = allData[selected].records;

  document.getElementById("totalTime").innerText =
    `今月の累積：${monthlyTotal}`;

  showList();
  updateChart();
  updateStatus();
});

</script>

</body>
</html>
